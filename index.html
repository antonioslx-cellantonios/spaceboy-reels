<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spaceboy Reels</title>
<link rel="icon" href="assets/img/logoSBverticalBlanco.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Logo pequeño fijo, visible siempre -->
<div class="corner-logo" id="corner-logo" hidden></div>

<header class="site-header">
  <div class="header-top">
    <div class="brand" id="brand">
      <span class="brand-name" id="brand-name">Spaceboy Reels</span>
    </div>
    <div class="header-controls">
      <button id="lang-toggle" class="lang-btn" type="button">EN</button>
      <button id="menu-toggle" class="menu-btn" type="button" aria-label="Menú">
  <svg class="menu-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
    <rect x="2" y="6" width="4" height="4" fill="none" stroke="currentColor"></rect>
    <line x1="10" y1="8" x2="22" y2="8"></line>
    <line x1="2" y1="16" x2="22" y2="16"></line>
  </svg>
</button>
      </button>
    </div>
  </div>
  <p class="event-name" id="event-name"></p>
  <p class="studio-description" id="studio-description"></p>
</header>

<div class="menu-overlay" id="menu-overlay" hidden></div>
<nav class="side-menu" id="side-menu" hidden>
  <button id="menu-close" class="close-btn menu-close-btn" type="button" aria-label="Cerrar menú">&times;</button>
  <ul>
    <li><button class="nav-link" data-target="section-reels" id="nav-home"></button></li>
    <li><button class="nav-link" data-target="section-contacto" id="nav-contacts"></button></li>
    <li><button class="nav-link" data-target="section-presentaciones" id="nav-presentations"></button></li>
  </ul>
</nav>

<main>
  <section id="section-reels" class="page-section">
    <h2 class="section-title" id="reels-title"></h2>
    <div id="grid" class="reel-grid" aria-label="Videos"></div>
  </section>

  <section id="section-contacto" class="page-section">
    <h2 class="section-title" id="contacts-title"></h2>
    <div id="contacts-grid" class="contacts-grid"></div>
    <p id="contacts-empty" class="empty-msg" hidden></p>
  </section>

  <section id="section-presentaciones" class="page-section">
    <h2 class="section-title" id="presentations-title"></h2>
    <div id="presentations-list" class="pres-list"></div>
    <p id="presentations-empty" class="empty-msg" hidden></p>
  </section>
</main>

<footer class="site-footer">
  <p id="site-footer"></p>
  <p id="site-footer-secondary"></p>
</footer>

<!-- Reproductor de video -->
<div class="overlay" id="player-overlay" hidden>
  <div class="overlay-box">
    <button class="close-btn" id="close-btn" type="button" aria-label="Cerrar">&times;</button>
    <div class="player-frame" id="player-frame"></div>
    <div class="overlay-caption">
      <h2 id="player-title"></h2>
      <p id="player-description"></p>
    </div>
  </div>
</div>

<!-- Visor de PDF -->
<div class="overlay" id="pdf-overlay" hidden>
  <div class="overlay-box pdf-overlay-box">
    <button class="close-btn" id="pdf-close-btn" type="button" aria-label="Cerrar">&times;</button>
    <div class="overlay-caption">
      <h2 id="pdf-title"></h2>
    </div>
    <iframe id="pdf-frame" class="pdf-frame" title="Presentación"></iframe>
  </div>
</div>

<script src="config.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
